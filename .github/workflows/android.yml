name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (logika uang rajin)
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: presensi-indo-hpl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Simpan APK ke branch "apk-build" supaya bisa diunduh langsung tanpa membuka Actions:
      # https://github.com/shinx2ran/Presensi-Indo-HPL/raw/apk-build/PresensiIndoHPL.apk
      - name: Publish APK ke branch apk-build
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/PresensiIndoHPL.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf --quiet .
          cp /tmp/PresensiIndoHPL.apk .
          printf '# APK Presensi Indo HPL\n\nDibangun dari commit %s (%s).\n\nUnduh: https://github.com/%s/raw/apk-build/PresensiIndoHPL.apk\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > README.md
          git add -f PresensiIndoHPL.apk README.md
          git commit -q -m "APK build dari $GITHUB_SHA"
          git push -f origin apk-build
