name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Kunci tanda tangan tetap untuk pembaruan OTA. Diisi owner sekali di
      # Settings > Secrets and variables > Actions: SIGNING_KEYSTORE_B64 dan SIGNING_PASSWORD.
      # Tanpa secret: build tetap jalan dengan kunci debug acak, tetapi update OTA tidak diterbitkan.
      - name: Kunci tanda tangan + nomor versi
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          echo "APP_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$SIGNING_KEYSTORE_B64" ] && [ -n "$SIGNING_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/presensi-signing.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/presensi-signing.p12" >> "$GITHUB_ENV"
            echo "SIGNING_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "STABLE_SIGNED=1" >> "$GITHUB_ENV"
            echo "Kunci tanda tangan tetap dipakai."
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 / SIGNING_PASSWORD belum diisi: APK memakai kunci debug acak dan pembaruan OTA tidak diterbitkan."
          fi

      - name: Unit tests (logika uang rajin, kedua varian)
        run: gradle --no-daemon testIndohplDebugUnitTest testEgkostDebugUnitTest

      - name: Build debug APK (Indo HPL + EG Kost)
        run: gradle --no-daemon assembleIndohplDebug assembleEgkostDebug

      - name: Upload APK Indo HPL
        uses: actions/upload-artifact@v4
        with:
          name: presensi-indo-hpl-debug
          path: app/build/outputs/apk/indohpl/debug/app-indohpl-debug.apk
          if-no-files-found: error

      - name: Upload APK EG Kost
        uses: actions/upload-artifact@v4
        with:
          name: presensi-eg-kost-debug
          path: app/build/outputs/apk/egkost/debug/app-egkost-debug.apk
          if-no-files-found: error

      # Simpan kedua APK ke branch "apk-build" supaya bisa diunduh langsung tanpa membuka Actions:
      #   https://github.com/shinx2ran/Presensi-Indo-HPL/raw/apk-build/PresensiIndoHPL.apk
      #   https://github.com/shinx2ran/Presensi-Indo-HPL/raw/apk-build/PresensiEGKost.apk
      # update-<varian>.json = manifest OTA yang dibaca aplikasi. Hanya diterbitkan bila APK memakai kunci tetap,
      # karena Android menolak memasang pembaruan bertanda tangan berbeda.
      - name: Publish APK ke branch apk-build
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          NOTES=$(printf '%s\n' "$COMMIT_MSG" | head -n 1)
          cp app/build/outputs/apk/indohpl/debug/app-indohpl-debug.apk /tmp/PresensiIndoHPL.apk
          cp app/build/outputs/apk/egkost/debug/app-egkost-debug.apk /tmp/PresensiEGKost.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf --quiet .
          cp /tmp/PresensiIndoHPL.apk /tmp/PresensiEGKost.apk .
          FILES="PresensiIndoHPL.apk PresensiEGKost.apk README.md"
          OTA="tidak (secret kunci belum diisi)"
          if [ "${STABLE_SIGNED:-}" = "1" ]; then
            OTA="ya, versi $APP_VERSION_CODE"
            for pair in "indohpl:PresensiIndoHPL" "egkost:PresensiEGKost"; do
              flavor="${pair%%:*}"; name="${pair##*:}"
              cp "$name.apk" "$name-$APP_VERSION_CODE.apk"
              jq -n \
                --argjson code "$APP_VERSION_CODE" \
                --arg vname "1.2.$APP_VERSION_CODE" \
                --arg url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/apk-build/$name-$APP_VERSION_CODE.apk" \
                --arg sha "$(sha256sum "$name.apk" | cut -d' ' -f1)" \
                --argjson size "$(stat -c%s "$name.apk")" \
                --arg notes "$NOTES" \
                --arg commit "${GITHUB_SHA::7}" \
                '{versionCode:$code, versionName:$vname, apkUrl:$url, sha256:$sha, sizeBytes:$size, notes:$notes, commit:$commit}' \
                > "update-$flavor.json"
              FILES="$FILES $name-$APP_VERSION_CODE.apk update-$flavor.json"
            done
          fi
          {
            printf '# APK Presensi\n\nDibangun dari commit %s (%s). Versi 1.2.%s. Update OTA: %s.\n\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$APP_VERSION_CODE" "$OTA"
            printf '| Aplikasi | Unduh |\n|---|---|\n'
            printf '| Presensi Indo HPL (HP kasir) | https://github.com/%s/raw/apk-build/PresensiIndoHPL.apk |\n' "$GITHUB_REPOSITORY"
            printf '| Presensi EG Kost | https://github.com/%s/raw/apk-build/PresensiEGKost.apk |\n' "$GITHUB_REPOSITORY"
          } > README.md
          # Nama file persis: pathspec git seperti '*.json' ikut menyapu file build di app/build.
          git add -f -- $FILES
          git commit -q -m "APK build dari $GITHUB_SHA"
          git push -f origin apk-build
