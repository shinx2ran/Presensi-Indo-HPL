    <section id="view-karyawan" class="view" hidden></section>
    <section id="view-pengaturan" class="view" hidden></section>
    <section id="view-hp" class="view" hidden></section>
    <section id="view-boot" class="view">

    <noscript><p class="card">Dashboard ini butuh JavaScript. Aktifkan JavaScript di browser lalu muat ulang.</p></noscript>
